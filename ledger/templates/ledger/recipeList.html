{% extends 'ledger/template.html' %}
{% load static %}

{% block title %}Recipe Book{% endblock %}

{% block content %}
    <h2>Recipe List</h2>

    {% if user.is_authenticated %}
        <a href="{% url 'ledger:recipe_add' %}">Add Recipe</a>
    {% endif %}
    
    <br>
    
    <ul>
    {% for recipe in recipe_list %}
        <li>
            <a href="../recipe/{{recipe.id}}">{{recipe.name}}</a>
        </li>
    {% endfor %}
    </ul>
{% endblock %}
